<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open in BeatThis</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .code-block {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 28px; letter-spacing: 6px; font-weight: 700;
      color: var(--accent); background: rgba(255,107,91,0.08);
      border: 1px solid var(--accent); padding: 16px 24px;
      border-radius: 12px; display: inline-block; margin-top: 8px;
    }
    .cta-row { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-top: 32px; }
    .cta-row a {
      display: inline-block; padding: 14px 28px; background: var(--accent);
      color: white; border-radius: 999px; font-weight: 700; letter-spacing: 0.3px;
      min-width: 240px; text-align: center; border-bottom: none;
    }
    .cta-row a:hover { background: #E85546; border-bottom: none; }
    .cta-row a.ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .cta-row a.ghost:hover { color: white; border-color: white; }
    .small { font-size: 14px; color: var(--text-muted); margin-top: 20px; }
    .join-page { text-align: center; padding-top: 60px; }
  </style>
</head>
<body>
  <div class="container join-page">
    <div class="top-nav" style="justify-content: center;">
      <a href="/" class="brand">BeatThis</a>
    </div>
    <p class="eyebrow" id="eyebrow">Invite</p>
    <h1 id="heading">Open in BeatThis</h1>
    <p class="tagline" id="tagline">A friend invited you on BeatThis.</p>
    <div id="codeBlock" style="display:none;" class="code-block"></div>
    <div class="cta-row">
      <a id="openBtn" href="#">Open BeatThis</a>
      <a class="ghost" href="https://apps.apple.com/app/beatthis-daily-challenges/id6780211717">Get BeatThis</a>
    </div>
    <p class="small">
      Have the app? Tap "Open BeatThis". Don't have it yet? Tap "Get BeatThis", install it, then reopen this link.
    </p>
    <div class="footer" style="margin-top: 80px;">
      <p>&copy; 2026 BeatThis. <a href="/">Home</a> &middot; <a href="/privacy">Privacy</a> &middot; <a href="/terms">Terms</a></p>
    </div>
  </div>
  <script>
    (function () {
      var path = window.location.pathname;
      var join = /^\/join\/([A-Z0-9]{6})\/?$/i.exec(path);
      var add  = /^\/add\/([A-Z0-9]{6})\/?$/i.exec(path);
      var m = join || add;
      if (!m) return;
      var code = m[1].toUpperCase();
      var kind = join ? 'join' : 'add';
      if (kind === 'add') {
        document.getElementById('eyebrow').textContent = 'Friend invite';
        document.getElementById('heading').textContent = 'Add me on BeatThis';
        document.getElementById('tagline').textContent = 'Open the app to add each other as friends.';
      } else {
        document.getElementById('eyebrow').textContent = 'Group invite';
        document.getElementById('heading').textContent = 'Join the group';
        document.getElementById('tagline').textContent = 'A friend invited you to a daily challenge group on BeatThis.';
      }
      var block = document.getElementById('codeBlock');
      block.textContent = code;
      block.style.display = 'inline-block';
      // User-tap only. No auto-redirect (iOS blocks non-gesture custom-scheme navigation).
      document.getElementById('openBtn').href = 'beatthis://' + kind + '/' + code;
    })();
  </script>
</body>
</html>
